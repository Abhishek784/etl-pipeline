paths:
  raw_articles: data/input/tech_news.csv
  raw_metadata: data/input/company_metadata.json
  warehouse: data/warehouse/arr.duckdb
  outputs: data/outputs/

fx_rates:
  USD: 1.0
  EUR: 1.1
  GBP: 1.27
  JPY: 0.006666666666666667   # 1/150

company_matching:
  fuzzy_accept_threshold: 90
  fuzzy_review_threshold: 80
  strip_suffixes: [inc, ltd, corp, corporation, technologies, plc]

company_size_bands:
  small_max: 9999        # < 10,000
  medium_max: 30000      # 10,000-30,000 inclusive; above is Large

ai_export:
  min_arr_usd: 50000000
  year_min: 2022
  year_max: 2024
  ai_category: AI_ML
  ai_industry: AI/ML

embeddings:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  dimensions: 384
  top_k_similar: 3

null_equivalents: ["", "n/a", "na", "none", "null", "not disclosed", "undisclosed"]